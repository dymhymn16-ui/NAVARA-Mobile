name: Build NAVARA Mobile APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "SAMP-Mobile-GTA-2.11.zip"
      - "app/src/main/cpp/samp/gui/samp_widgets/keyboard.cpp"
      - "app/src/main/cpp/samp/gui/samp_widgets/keyboard.h"
      - ".github/workflows/navara-mobile-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-36" \
                      "build-tools;36.0.0" \
                      "ndk;26.2.11394342" \
                      "cmake;3.22.1"

      - name: Extract mobile project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q SAMP-Mobile-GTA-2.11.zip -d project

          APP="project/SAMP-Mobile-GTA-2.11"
          WIDGETS="$APP/app/src/main/cpp/samp/gui/samp_widgets"
          GAME="$APP/app/src/main/cpp/samp/game"

          if [ -f "app/src/main/cpp/samp/gui/samp_widgets/keyboard.h" ]; then
            cp \
              "app/src/main/cpp/samp/gui/samp_widgets/keyboard.h" \
              "$WIDGETS/keyboard.h"
          fi

          if [ -f "app/src/main/cpp/samp/gui/samp_widgets/keyboard.cpp" ]; then
            cp \
              "app/src/main/cpp/samp/gui/samp_widgets/keyboard.cpp" \
              "$WIDGETS/keyboard.cpp"
          fi

          rm -f "$WIDGETS/playerTabList.h"
          rm -f "$GAME/RGBA.h"

          ln -s playertablist.h "$WIDGETS/playerTabList.h"
          ln -s rgba.h "$GAME/RGBA.h"

      - name: Build Debug APK
        working-directory: project/SAMP-Mobile-GTA-2.11
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-RP-Mobile-APK
          path: project/SAMP-Mobile-GTA-2.11/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
