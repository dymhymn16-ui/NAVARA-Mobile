name: Build NAVARA Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q SAMP-Mobile-GTA-2.11.zip -d project

      - name: Fix Linux header case
        run: |
          GAME="project/SAMP-Mobile-GTA-2.11/app/src/main/cpp/samp/game"
          WIDGETS="project/SAMP-Mobile-GTA-2.11/app/src/main/cpp/samp/gui/samp_widgets"

          if [ -f "$WIDGETS/playertablist.h" ]; then
            cp "$WIDGETS/playertablist.h" "$WIDGETS/playerTabList.h"
          fi

          if [ -f "$GAME/rgba.h" ]; then
            cp "$GAME/rgba.h" "$GAME/RGBA.h"
          fi

      - name: Build APK
        working-directory: project/SAMP-Mobile-GTA-2.11
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-Mobile-APK
          path: project/SAMP-Mobile-GTA-2.11/app/build/outputs/apk/**/*.apk
