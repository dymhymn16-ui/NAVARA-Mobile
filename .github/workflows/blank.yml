name: Build NAVARA Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q SAMP-Mobile-GTA-2.11.zip -d project

      - name: Restore playerTabList.h
        run: |
          mkdir -p project/SAMP-Mobile-GTA-2.11/app/src/main/cpp/samp/gui/samp_widgets
          cat > project/SAMP-Mobile-GTA-2.11/app/src/main/cpp/samp/gui/samp_widgets/playerTabList.h <<'EOF'
          #pragma once

          #include "dialogs/tablistwidget.h"

          class PlayerTabList : public Widget
          {
          public:
              PlayerTabList();

              void show();
              void hide();

              void assemble();

              virtual void performLayout() override;
              virtual void draw(ImGuiRenderer* renderer) override;
              virtual void activateEvent(bool active) override;

          private:
              TabListWidget* m_tabList;
              Label* m_lServerName;
              Label* m_lTotalPlayers;
          };
          EOF

      - name: Fix RGBA header case
        run: |
          if [ -f project/SAMP-Mobile-GTA-2.11/app/src/main/cpp/samp/game/rgba.h ]; then
            cp project/SAMP-Mobile-GTA-2.11/app/src/main/cpp/samp/game/rgba.h project/SAMP-Mobile-GTA-2.11/app/src/main/cpp/samp/game/RGBA.h
          fi

      - name: Build APK
        working-directory: project/SAMP-Mobile-GTA-2.11
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-Mobile-APK
          path: project/SAMP-Mobile-GTA-2.11/app/build/outputs/apk/**/*.apk
