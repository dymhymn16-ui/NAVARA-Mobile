name: Build NAVARA Mobile APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract mobile project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          APP="$(find project -type f -name 'gradlew' -print -quit | xargs -r dirname)"

          if [ -z "$APP" ] || [ ! -f "$APP/gradlew" ]; then
            echo "ERROR: Android Gradle project not found."
            find project -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "Android project: $APP"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-36" \
                      "build-tools;36.0.0" \
                      "ndk;26.2.11394342" \
                      "cmake;3.22.1"

      - name: Build Debug APK
        working-directory: ${{ env.APP }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          APK="$(find "${APP}/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/NAVARA-RP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-RP-Mobile-APK
          path: release/NAVARA-RP.apk
          if-no-files-found: error
