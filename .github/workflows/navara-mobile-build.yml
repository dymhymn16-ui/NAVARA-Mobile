name: Build NAVARA Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract mobile project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project ZIP..."

          ZIP="$(find . -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "Searching for Gradle project..."

          APP="$(find project -type f -name 'gradlew' -print -quit | xargs -r dirname)"

          if [ -z "$APP" ] || [ ! -f "$APP/gradlew" ]; then
            echo "ERROR: Android Gradle project was not found."

            echo "Project files:"
            find project -maxdepth 5 -type f | head -n 200

            exit 1
          fi

          echo "Android project found:"
          echo "$APP"

          echo "APP=$APP" >> "$GITHUB_ENV"

          WIDGETS="$APP/app/src/main/cpp/samp/gui/samp_widgets"
          GAME="$APP/app/src/main/cpp/samp/game"

          echo "Checking source files..."

          # Use the keyboard files from repository root if they exist.
          if [ -f "app/src/main/cpp/samp/gui/samp_widgets/keyboard.h" ]; then
            cp \
              "app/src/main/cpp/samp/gui/samp_widgets/keyboard.h" \
              "$WIDGETS/keyboard.h"
          fi

          if [ -f "app/src/main/cpp/samp/gui/samp_widgets/keyboard.cpp" ]; then
            cp \
              "app/src/main/cpp/samp/gui/samp_widgets/keyboard.cpp" \
              "$WIDGETS/keyboard.cpp"
          fi

          # Fix Linux case-sensitive header issue.
          if [ -f "$WIDGETS/playertablist.h" ]; then
            rm -f "$WIDGETS/playerTabList.h"
            ln -s playertablist.h "$WIDGETS/playerTabList.h"
          fi

          # Fix Linux case-sensitive RGBA header issue.
          if [ -f "$GAME/rgba.h" ]; then
            rm -f "$GAME/RGBA.h"
            ln -s rgba.h "$GAME/RGBA.h"
          fi

          echo "Source preparation completed."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.2.11394342" \
            "cmake;3.22.1"

      - name: Verify Gradle project
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          echo "Gradle project:"
          pwd

          echo "Gradle wrapper:"
          ls -la gradlew

          echo "Gradle version:"
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ env.APP }}
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK="$(find "${APP}/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo "Build output:"
            find "${APP}/app/build/outputs" \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p release

          cp "$APK" "release/NAVARA-RP.apk"

          echo "Final APK:"
          ls -lh "release/NAVARA-RP.apk"

      - name: Upload NAVARA APK
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-RP-Mobile-APK
          path: release/NAVARA-RP.apk
          if-no-files-found: error
