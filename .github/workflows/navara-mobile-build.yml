name: Build NAVARA Mobile APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

env:
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NDK_VERSION: "26.2.11394342"
  CMAKE_VERSION: "3.22.1"

jobs:
  build:
    name: Build and upload NAVARA-RP APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Locate and extract mobile project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir -p project

          # The repository may contain the mobile project directly or as a ZIP.
          if find . -maxdepth 3 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | grep -q .; then
            ROOT="$(find . -maxdepth 3 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs dirname)"
            cp -a "$ROOT" project/mobile
          else
            ZIP="$(find . -maxdepth 4 -type f -iname '*.zip' -print -quit)"
            if [ -z "${ZIP:-}" ]; then
              echo "No Android project or ZIP file was found in the repository."
              find . -maxdepth 3 -type f | sort | head -200
              exit 1
            fi
            echo "Using ZIP: $ZIP"
            unzip -q "$ZIP" -d project

            ROOT="$(find project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs dirname)"
            if [ -z "${ROOT:-}" ] || [ ! -f "$ROOT/gradlew" ]; then
              echo "The ZIP does not contain a valid Gradle Android project."
              find project -maxdepth 5 -type f | sort | head -300
              exit 1
            fi
          fi

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Detected project: $ROOT"

      - name: Apply safe Linux case aliases
        shell: bash
        run: |
          set -euo pipefail

          WIDGETS="$PROJECT_ROOT/app/src/main/cpp/samp/gui/samp_widgets"
          GAME="$PROJECT_ROOT/app/src/main/cpp/samp/game"

          # Do not duplicate class/header contents. Linux is case-sensitive;
          # expose aliases to the canonical lowercase headers instead.
          if [ -f "$WIDGETS/playertablist.h" ]; then
            rm -f "$WIDGETS/playerTabList.h"
            ln -s playertablist.h "$WIDGETS/playerTabList.h"
          fi

          if [ -f "$GAME/rgba.h" ]; then
            rm -f "$GAME/RGBA.h"
            ln -s rgba.h "$GAME/RGBA.h"
          fi

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROJECT_ROOT/gradlew"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          chmod +x "$PROJECT_ROOT/gradlew"
          echo "Android project validation passed."

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_ROOT/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/NAVARA-RP.apk"
          echo "APK created: $GITHUB_WORKSPACE/NAVARA-RP.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAVARA-RP-Mobile-APK
          path: NAVARA-RP.apk
          if-no-files-found: error
          retention-days: 14
